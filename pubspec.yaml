name: trainer_backend
description: "A Flutter package for interacting with the Trainer backend."
version: 0.0.1+1
homepage:

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: 3.35.2

dependencies:
  flutter:
    sdk: flutter
  
  # Environment
  flutter_dotenv: ^5.2.1

  #Backend
  supabase_flutter: ^2.9.1

  # RevenueCat for subscriptions
  purchases_flutter: ^9.9.1

  # API communication
  json_annotation: 4.9.0

  # Tools
  copy_with_extension: 6.0.1  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  copy_with_extension_gen: ^6.0.1
  json_serializable: ^6.9.5
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: false

  assets:
    - .env