name: trainer_backend
description: "A Flutter package for interacting with the Trainer backend."
version: 0.0.1+1
homepage:

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.44.2

dependencies:
  flutter:
    sdk: flutter
  
  # Environment
  flutter_dotenv: ^6.0.1

  #Backend
  supabase_flutter: ^2.15.0

  # RevenueCat for subscriptions
  purchases_flutter: ^10.3.0

  # API communication
  json_annotation: ^4.12.0

  # Tools
  copy_with_extension: ^15.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  copy_with_extension_gen: ^15.0.1
  json_serializable: ^6.14.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - .env
