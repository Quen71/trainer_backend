name: trainer_backend
description: "A Flutter package for interacting with the Trainer backend."
version: 0.0.1+1
homepage:

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: 3.41.4

dependencies:
  flutter:
    sdk: flutter
  
  # Environment
  flutter_dotenv: ^6.0.0

  #Backend
  supabase_flutter: ^2.12.0

  # RevenueCat for subscriptions
  purchases_flutter: ^9.15.0

  # API communication
  json_annotation: ^4.11.0

  # Tools
  copy_with_extension: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  copy_with_extension_gen: ^13.0.0
  json_serializable: ^6.13.0
  build_runner: ^2.13.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - .env